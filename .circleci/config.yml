version: 2.1

commands:
  download_available_models:
    steps:
      - run:
          name: download available models from datashare-python release
          command: |
            ASR_WORKER_VERSION=$(mvn help:evaluate -Dexpression=asr-worker.version -q -DforceStdout)
            echo "downloading available-models.json for asr-worker-${ASR_WORKER_VERSION}"
            mkdir -p src/main/resources
            curl -fsSL "https://github.com/ICIJ/datashare-python/releases/download/asr-worker-${ASR_WORKER_VERSION}/available-models.json" \
              -o src/main/resources/available-models.json

jobs:
  build:
    docker:
      - image: cimg/openjdk:21.0

    environment:
      MAVEN_OPTS: "-Xms512m -Xmx512m -Xss10M"

    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            - v1-dependencies-

      - run: mvn validate
      - run: mvn test

      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies-{{ checksum "pom.xml" }}

  build-plugin:
    docker:
      - image: cimg/node:20.19

    steps:
      - checkout

      - restore_cache:
          keys:
            - v2-plugin-dependencies-{{ checksum "plugins/asr/yarn.lock" }}
            - v2-plugin-dependencies-

      - run:
          name: install plugin dependencies
          command: cd plugins/asr && yarn install

      - run:
          name: run plugin tests
          command: cd plugins/asr && npx vitest run

      - run:
          name: build plugin
          command: cd plugins/asr && yarn build

      - save_cache:
          paths:
            - plugins/asr/node_modules
          key: v2-plugin-dependencies-{{ checksum "plugins/asr/yarn.lock" }}

  release:
    docker:
      - image: cimg/openjdk:21.0

    environment:
      MAVEN_OPTS: "-Xms512m -Xmx512m -Xss10M"

    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            - v1-dependencies-

      - download_available_models

      - run:
          name: package datashare asr extension
          command: mvn package -Dmaven.test.skip=true

      - run:
          name: deploy datashare asr extension jar to github release
          command: |
            upload_url=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              -d "{\"tag_name\":\"${CIRCLE_TAG}\", \"name\":\"${CIRCLE_TAG}\", \"body\":\"release ${CIRCLE_TAG}\"}" \
              "https://api.github.com/repos/ICIJ/datashare-extension-asr/releases" | jq -r '.upload_url')
            upload_url="${upload_url%\{*}"
            echo "uploading asset to release url: $upload_url"
            curl -s -m 120 \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/java-archive" \
              --data-binary "@target/datashare-extension-asr-${CIRCLE_TAG}-jar-with-dependencies.jar" \
              "$upload_url?name=datashare-extension-asr-${CIRCLE_TAG}-jar-with-dependencies.jar&label=datashare-extension-asr-${CIRCLE_TAG}-jar-with-dependencies.jar"

      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies-{{ checksum "pom.xml" }}

workflows:
  version: 2
  build_workflow:
    jobs:
      - build:
          filters:
            tags:
              only: /.*/
      - build-plugin:
          filters:
            tags:
              only: /.*/
      - release:
          requires:
            - build
          filters:
            tags:
              only: /^[0-9.]*/
            branches:
              ignore: /.*/
