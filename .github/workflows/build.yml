name: Build

on:
  push:
    branches: ['**']
    tags: ['[0-9]*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: mvn validate
      - run: mvn test

  build-plugin:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: plugins/asr

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: plugins/asr/yarn.lock

      - run: yarn install
      - run: npx vitest run
      - run: yarn build

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download available models from datashare-python release
        run: |
          ASR_WORKER_VERSION=$(mvn help:evaluate -Dexpression=asr-worker.version -q -DforceStdout)
          echo "downloading available-models.json for asr-worker-${ASR_WORKER_VERSION}"
          mkdir -p src/main/resources
          curl -fsSL "https://github.com/ICIJ/datashare-python/releases/download/asr-worker-${ASR_WORKER_VERSION}/available-models.json" \
            -o src/main/resources/available-models.json

      - name: Package datashare asr extension
        run: mvn package -Dmaven.test.skip=true

      - name: Create GitHub release and upload jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          JAR="target/datashare-extension-asr-${TAG}-jar-with-dependencies.jar"
          gh release create "${TAG}" "${JAR}" \
            --title "${TAG}" \
            --notes "release ${TAG}"
